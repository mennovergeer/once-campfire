name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned OSV Scanner
        run: |
          curl --fail --location https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan dependencies
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source --recursive --no-resolve --no-call-analysis=go --format json --output-file osv-results.json .
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-results
          path: osv-results.json

